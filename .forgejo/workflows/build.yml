name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

enable-openid-connect: true

jobs:
  release:
    runs-on: docker
    container:
      image: alpine:latest
      entrypoint: []
      tty: true
    steps:
      - name: Install tools
        run: apk add --no-cache curl jq git
      - name: fetch jwt
        id: token
        env:
          AUD: u:1:cd0d5a55-2cfa-49df-8d92-0c2c69aa7d2a
        run: |
          resp=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD")
          jwt=$(echo "$resp" | jq -r '.value')
          echo "FETCH_JWT_LEN=${#jwt}"
          echo "::add-mask::$jwt"
          echo "token=$jwt" >> $FORGEJO_OUTPUT
      - name: reproduce publish
        env:
          JWT: ${{ steps.token.outputs.token }}
        run: |
          echo "OUT_TOKEN_LEN=${#JWT}"
          API="${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          h() { echo "  -> HTTP_CODE:$2"; }
          echo "===== 1 GET release by tag latest ====="
          curl -sS -o /tmp/r1 -w "  HTTP_CODE:%{http_code}\n" -H "Authorization: Bearer $JWT" "$API/releases/tags/latest"; echo "  body:"; cat /tmp/r1; echo
          echo "===== 2 GET git ref tags/latest ====="
          curl -sS -o /tmp/r2 -w "  HTTP_CODE:%{http_code}\n" -H "Authorization: Bearer $JWT" "$API/git/ref/tags/latest"; echo "  body:"; cat /tmp/r2; echo
          echo "===== 3 POST release on latest (target_commitish = full sha) ====="
          curl -sS -o /tmp/r3 -w "  HTTP_CODE:%{http_code}\n" -H "Authorization: Bearer $JWT" -H "Content-Type: application/json" -X POST \
            -d "$(jq -n --arg tag latest --arg name 'Latest Build' --arg body 'test body' --arg sha '${{ github.sha }}' '{tag:$tag,name:$name,body:$body,target_commitish:$sha,prerelease:true}')" \
            "$API/releases"; echo "  body:"; cat /tmp/r3; echo
          echo "===== 4 POST release on latest WITHOUT target_commitish ====="
          curl -sS -o /tmp/r4 -w "  HTTP_CODE:%{http_code}\n" -H "Authorization: Bearer $JWT" -H "Content-Type: application/json" -X POST \
            -d '{"tag_name":"latest","name":"Latest Build2","body":"test2"}' \
            "$API/releases"; echo "  body:"; cat /tmp/r4; echo
          echo "===== 5 POST release using tag_name key on OTHER tag diag-b ====="
          curl -sS -o /tmp/r5 -w "  HTTP_CODE:%{http_code}\n" -H "Authorization: Bearer $JWT" -H "Content-Type: application/json" -X POST \
            -d '{"tag_name":"diag-b","name":"Diag B","body":"b"}' \
            "$API/releases"; echo "  body:"; cat /tmp/r5; echo
