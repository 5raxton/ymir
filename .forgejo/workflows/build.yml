name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

enable-openid-connect: true

jobs:
  release:
    runs-on: docker
    container:
      image: alpine:latest
      entrypoint: []
      tty: true
    steps:
      - name: Install tools
        run: apk add --no-cache curl jq git
      - name: DIAG write test
        id: token
        env:
          AUD: u:1:cd0d5a55-2cfa-49df-8d92-0c2c69aa7d2a
        run: |
          echo "::group::fetch jwt + write test"
          resp=$(curl -sS -w "\nHTTP_CODE:%{http_code}" \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD")
          jwt=$(echo "$resp" | head -1 | jq -r '.value // empty')
          echo "JWT_LENGTH=${#jwt}"
          echo "::add-mask::$jwt"
          API="${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          echo "===== POST release on tag diag-write-test ====="
          curl -sS -w "\nHTTP_CODE:%{http_code}\n" \
            -H "Authorization: Bearer $jwt" \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{"tag_name":"diag-write-test","name":"DIAG Write Test","body":"diag"}' \
            "$API/releases"
          echo "===== POST tag/ref ====="
          curl -sS -w "\nHTTP_CODE:%{http_code}\n" \
            -H "Authorization: Bearer $jwt" \
            -H "Content-Type: application/json" \
            -X POST \
            -d "{\"ref\":\"refs/tags/diag-write-test\",\"sha\":\"${{ github.sha }}\"}" \
            "$API/git/refs"
          echo "===== GET tag ====="
          curl -sS -w "\nHTTP_CODE:%{http_code}\n" \
            -H "Authorization: Bearer $jwt" \
            "$API/git/refs/tags/diag-write-test"
          echo "::endgroup::"
