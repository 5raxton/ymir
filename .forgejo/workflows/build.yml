name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

enable-openid-connect: true

jobs:
  build:
    runs-on: docker
    container:
      image: alpine:latest
      entrypoint: []
      tty: true
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, debian, fedora, opensuse]
    steps:
      - name: Install tools
        run: apk add --no-cache curl jq git nodejs
      - name: fake artifact
        run: |
          mkdir -p out
          echo "hi-${{ matrix.distro }}" > out/ymir-${{ matrix.distro }}-x86_64.tar.gz
      - name: simulate long build
        if: matrix.distro == 'arch'
        run: sleep 600
      - name: Upload artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: ymir-${{ matrix.distro }}-x86_64
          path: out/ymir-${{ matrix.distro }}-x86_64.tar.gz

  release:
    needs: build
    runs-on: docker
    container:
      image: alpine:latest
      entrypoint: []
      tty: true
    steps:
      - name: Install tools
        run: apk add --no-cache curl jq git nodejs

      - name: Fetch API token (Authorized Integration)
        id: token
        env:
          AUD: u:1:cd0d5a55-2cfa-49df-8d92-0c2c69aa7d2a
        run: |
          echo "REQ_URL=${ACTIONS_ID_TOKEN_REQUEST_URL:-<EMPTY>}"
          echo "REQ_TOKEN_LEN=${#ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
          if [ -z "$AUD" ]; then
            echo "::error::No Audience configured" >&2
            exit 1
          fi
          jwt=$(curl --fail -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" \
            | jq -r '.value')
          echo "JWT_LEN=${#jwt}"
          if [ -z "$jwt" ]; then
            echo "::error::OIDC fetch returned no token" >&2
            exit 1
          fi
          echo "::add-mask::$jwt"
          echo "token=$jwt" >> $FORGEJO_OUTPUT

      - name: Checkout (for release notes)
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          path: artifacts

      - name: Verify token output after uses-steps
        run: |
          T="${{ steps.token.outputs.token }}"
          echo "EXPR_TOKEN_LEN=${#T}"
          if [ -z "$T" ]; then echo "EXPR_TOKEN_EMPTY=yes"; else echo "EXPR_TOKEN_EMPTY=no"; fi
